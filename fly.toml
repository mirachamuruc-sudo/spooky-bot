# fly.toml app configuration file generated for spooky-bot-pftnxq on 2026-10-04T16:43:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spooky-bot-pftnxq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'

[processes]
  app = 'python bot.py'

[[mounts]]
  source = 'halloween_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
